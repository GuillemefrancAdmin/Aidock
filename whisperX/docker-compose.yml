services:
  whisperx:
    build:
      context: .
      dockerfile: Dockerfile
    image: whisperx-webui:local
    container_name: whisperx-webui
    ports:
      - "3000:3000"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 3000
      HF_HOME: /cache/huggingface
      # Optional: seed the token from the host (or a .env file) instead of the UI.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./sample:/app/sample
      - whisperx-huggingface:/cache/huggingface
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped

volumes:
  whisperx-huggingface:
